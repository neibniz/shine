# C++ Shine 客户端。auth 应与服务端其中一个用户相同。
metrics:
  listen: 127.0.0.1:9101
inbounds:
  - tag: socks-in
    protocol: socks5
    listen: 127.0.0.1:1080
outbounds:
  - tag: direct
    protocol: direct
  - tag: shine-out
    protocol: shine-client
    server: 127.0.0.1:7011
    users:
      - auth: "replace-with-first-secret"
        email: "first@example.com"
    compression: true
route:
  default: shine-out
